[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[project]
name = "mhs5200a-mcp"
version = "0.1.0"
description = "MCP Server for MHS-5200A series signal generators, providing tools for frequency control, waveform generation, and sweeps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Naoya Imai" },
]
keywords = [
    "mcp",
    "signal-generator",
    "mhs5200",
    "serial",
    "test-equipment",
    "waveform",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "fastmcp>=2.14.3",
    "mcp[cli]>=1.25.0",
    "mhs5200>=0.1.0",
]

[project.scripts]
mhs5200a-mcp = "mhs5200a_mcp.server:main"

[project.urls]
Homepage = "https://github.com/NaoNaoMe/mhs5200a-mcp"
Repository = "https://github.com/NaoNaoMe/mhs5200a-mcp"
Issues = "https://github.com/NaoNaoMe/mhs5200a-mcp/issues"

